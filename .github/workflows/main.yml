name: AI Manhwa Recapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ai-recapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Kokoro Models
        id: cache-kokoro
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-models-v1.0

      # >>> THE FIX IS HERE <<<
      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends xvfb ffmpeg espeak-ng

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Run AI Video Recapper
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python recap.py

      - name: Upload Generated Artifacts
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: recap-outputs
          path: |
            **/*.mp4
            **/*.txt

      - name: Commit and Push Lore
        if: always()
        run: |
          git config --global user.name "AI Recapper Bot"
          git config --global user.email "bot@github.com"
          
          echo "*.mp4" >> .gitignore
          
          git add .
          git commit -m "Update Manhwa Lore and Progress" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
