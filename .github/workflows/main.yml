name: AI Manhwa Recapper (Automated Pipeline)
on: 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-ai-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libgl1
          pip install seleniumbase requests pillow opencv-python-headless numpy google-generativeai edge-tts
          seleniumbase install chromedriver

      - name: Run AI Video Recapper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python recap.py

      - name: Upload Video Artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: recap-video
          path: videos/

      - name: Commit and Push Recap
        if: always()
        run: |
          git config --global user.name "AI Recapper Bot"
          git config --global user.email "bot@github.com"
          mkdir -p videos
          git add videos/
          git commit -m "Auto-generate Manhwa Recap Video" || echo "No changes"
          git push
