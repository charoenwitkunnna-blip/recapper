name: AI Manhwa Recapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ai-recapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Python with automatic pip caching
      # This will now successfully find requirements.txt and create a cache!
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Cache the heavy Kokoro ONNX models to save download time
      - name: Cache Kokoro Models
        id: cache-kokoro
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-models-v1.0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg espeak-ng

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Run AI Video Recapper
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python recap.py

      - name: Upload Generated Artifacts
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: recap-outputs
          path: |
            videos/*.mp4
            **/*.txt

      - name: Commit and Push Video & Lore
        if: always()
        run: |
          git config --global user.name "AI Recapper Bot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "Auto-generate Manhwa Recap Video & Update Lore" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push