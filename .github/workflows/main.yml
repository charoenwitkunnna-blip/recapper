name: Local AI Manhwa Recapper
on: 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-local-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. CACHE OLLAMA MODELS
      - name: Cache Ollama Models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-moondream-v1

      - name: Install and Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull moondream

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 2. INSTALL UNDETECTED BROWSER & VIRTUAL SCREEN
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install seleniumbase requests
          seleniumbase install chromedriver

      # 3. RUN WITH VIRTUAL SCREEN (xvfb-run)
      - name: Run AI Scraper and Recapper
        run: |
          xvfb-run python recap.py

      - name: Commit and Push Recap
        run: |
          git config --global user.name "AI Recapper Bot"
          git config --global user.email "bot@github.com"
          git add recaps/
          git commit -m "Auto-recap Infinite Mage Ch 122" || echo "No changes"
          git push
