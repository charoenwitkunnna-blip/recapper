name: AI Manhwa Recapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ai-recapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Kokoro Models
        id: cache-kokoro
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-models-v1.0

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends xvfb ffmpeg espeak-ng

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Run AI Video Recapper
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python recap.py

      - name: Upload Full Recap as Artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: full-recap-video
          # This only grabs the videos inside the "videos" folder (like full_recap.mp4)
          path: videos/*.mp4
          retention-days: 5 

      - name: Commit and Push Chapter Progress
        if: always()
        run: |
          git config --global user.name "AI Recapper Bot"
          git config --global user.email "bot@github.com"
          
          # 1. Ignore the videos/ folder (which holds the massive full recaps)
          # 2. Ignore temporary script outputs and models
          echo "videos/" >> .gitignore
          echo "*/temp/" >> .gitignore
          echo "*.onnx" >> .gitignore
          echo "*.bin" >> .gitignore
          
          # Now it is safe to git add everything else. 
          # This WILL include manga_name/chapters/1/video.mp4 and your .txt lore files!
          git add .
          
          git commit -m "Update chapter videos and lore" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main
