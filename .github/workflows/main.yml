name: AI Manhwa Recapper
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ai-recapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # xvfb is for Selenium, ffmpeg for video, espeak-ng is required by Kokoro-TTS
          sudo apt-get install -y xvfb ffmpeg espeak-ng

      - name: Install Python Dependencies
        run: |
          pip install seleniumbase requests pillow numpy soundfile kokoro-onnx
          seleniumbase install chromedriver

      - name: Run AI Video Recapper
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          python recap.py

      - name: Upload Generated Artifacts
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: recap-outputs
          # Grabs the actual generated videos and all lore/tracking files
          path: |
            videos/*.mp4
            */**/*.txt

      - name: Commit and Push Video & Lore
        if: always()
        run: |
          git config --global user.name "AI Recapper Bot"
          git config --global user.email "bot@github.com"
          git pull --rebase origin main || true
          
          # Add all generated folders (Lore, Chapters, Videos)
          git add .
          
          git commit -m "Auto-generate Manhwa Recap Video & Update Lore" || echo "No changes"
          git push