name: Local AI Manhwa Recapper
on: 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-local-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. CACHE OLLAMA MODELS
      - name: Cache Ollama Models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-moondream-v1

      - name: Install and Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          # If the cache hit, this takes 1 second. If not, it downloads.
          ollama pull moondream

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 2. INSTALL PLAYWRIGHT
      - name: Install Python dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run AI Scraper and Recapper
        run: |
          python recap.py

      # 3. UPLOAD SCREENSHOT SO YOU CAN SEE WHAT FAILED
      - name: Upload Debug Screenshot
        if: always() # This ensures the screenshot uploads even if the python script crashes
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_screenshot.png

      - name: Commit and Push Recap
        run: |
          git config --global user.name "AI Recapper Bot"
          git config --global user.email "bot@github.com"
          git add recaps/
          git commit -m "Auto-recap Infinite Mage Ch 122" || echo "No changes"
          git push
