name: Local AI Manhwa Recapper
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-local-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Ollama Models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-minicpm-v-only

      - name: Install and Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sleep 10
          # Pulling the single, powerful multimodal model for Director + Writer
          ollama pull minicpm-v

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg
          # No Tesseract needed anymore! AI handles OCR natively.
          pip install seleniumbase requests pillow gtts
          seleniumbase install chromedriver

      - name: Run AI Video Recapper
        run: |
          python recap.py

      - name: Upload Video Artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: recap-video
          path: videos/

      - name: Commit and Push Recap
        if: always()
        run: |
          git config --global user.name "AI Recapper Bot"
          git config --global user.email "bot@github.com"
          mkdir -p videos
          git add videos/
          git commit -m "Auto-generate Manhwa Recap Video" || echo "No changes"
          git push
